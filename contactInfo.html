<!doctype html>
<html>
	
	<head>
		
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- reset zoom -->
		<link rel="stylesheet" href="style.css"> <!-- style sheet -->
		<link rel="icon" type="image/x-icon" href="logo/101bagellogo.png"> <!-- logo favicon -->
		
		<title>
			
			101 Bagels &amp; Subs Contacts
		
		</title>
		
		<style>
		
			.contact-container {
			  max-width: calc(0.9 * var(--maxWidth));
			  margin: calc(0.02 * var(--maxWidth)) auto;
			  padding: calc(0.02 * var(--maxWidth));
			  background-color: #fff1c7ff;
			  border: calc(0.004 * var(--maxWidth)) solid #664730;
			}

			.contact-container input[type="text"],
			.contact-container select,
			.contact-container textarea {
			  width: 100%;
			  padding: calc(0.015 * var(--maxWidth));
			  margin-top: calc(0.01 * var(--maxWidth));
			  margin-bottom: calc(0.02 * var(--maxWidth));
			  box-sizing: border-box;
			  border: calc(0.002 * var(--maxWidth)) solid #664730;
			  font-size: calc(0.017 * var(--maxWidth));
			}

			.contact-container input[type="submit"] {
			  background-color: #664730;
			  color: #fff1c7ff;
			  padding: calc(0.015 * var(--maxWidth)) calc(0.03 * var(--maxWidth));
			  border: none;
			  border-radius: calc(0.005 * var(--maxWidth));
			  font-size: calc(0.018 * var(--maxWidth));
			  cursor: pointer;
			  transition: all 0.3s ease;
			}

			.contact-container input[type="submit"]:hover {
			  background-color: #83654f;
			  color: #fff1c7ff;
			}

			.contact-container label {
			  font-size: calc(0.018 * var(--maxWidth));
			  color: #664730;
			}

		
		</style>
		
	</head>

		<body>
			
			<!-- header + navigation -->
			<div id="header">
				
				<!-- logo box -->
				<div id="logo">
					
					<img src="logo/101bagellogo.png" width="92.06" height="100" alt="101bagellogo"/>
				
				</div> 
				<!-- end of logo box -->
				
				<!-- Navigation -->
				<div id="navDiv" class="btn-group">

				  <!-- Hamburger icon for mobile -->
				  <div id="menu-icon" onclick="toggleMenu()">☰</div>

				<!-- Actual nav links -->
				<div id="menu-links">
					<a href="index.html" class="nav">Home</a>
					<a href="menu.html" class="nav">Menu</a>
					<a href="about.html" class="nav">About</a>
					<a href="contactInfo.html" class="nav">Contact</a>
				</div>


				</div>
				<!-- end Navigation -->
			
			</div>
			
			<div id="content">
			
				<div class="contact-container roundAll">
					
				<h1>Feel free to contact us!</h1>
				<h3>You can reach us on <a href="https://www.instagram.com/101_bagels/?hl=en" style="color="orange"">Instagram</a> and <a href="https://www.facebook.com/101bagels/" style="color="color"">Facebook</a>.</h3>
				  <form action="action_page.php">
					<label for="email">Email</label>
					<input type="text" id="email" name="email" placeholder="Your email..">

					<label for="name">Name</label>
					<input type="text" id="name" name="name" placeholder="Your last name..">

					<label for="country">Country</label>
					<select id="country" name="country">
					  <option value="usa">USA</option>
					  <option value="canada">Canada</option>
					  <option value="other">Other</option>
					</select>

					<label for="subject">Subject</label>
					<textarea id="subject" name="subject" placeholder="Write something.." style="height:calc(0.2 * var(--maxWidth))"></textarea>

					<input type="submit" value="Submit">
				  </form>
				</div>

			
			</div>
			
			
			
		<!-- copyright w/ automatically updating year -->
		<div id="footer">

			Copyright &copy; <script>document.write(new Date().getFullYear())</script> 101 Bagels and Subs

		</div>
		<!-- end copyright -->
			
			
			<script>
function toggleMenu() {
  const menu = document.getElementById('menu-links');
  menu.classList.toggle('active');
}
</script>

		</body>

	
	
	
	
	
	
	
	
	
	
	
	
	
	
	
	
	
	
	
	
	
	
	
</html>
